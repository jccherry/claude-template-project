name: Auto Tag on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest_tag
        run: |
          # Find the latest semver tag, default to 0.0.0 if none exist
          LATEST=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          if [ -z "$LATEST" ]; then
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          else
            echo "version=${LATEST#v}" >> "$GITHUB_OUTPUT"
          fi
          echo "Latest tag: ${LATEST:-none}"

      - name: Determine version bump from PR labels
        id: bump
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          CURRENT: ${{ steps.latest_tag.outputs.version }}
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if echo "$LABELS" | grep -qi "semver:major"; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif echo "$LABELS" | grep -qi "semver:minor"; then
            MAJOR=$MAJOR
            MINOR=$((MINOR + 1))
            PATCH=0
          elif echo "$LABELS" | grep -qi "semver:patch"; then
            MAJOR=$MAJOR
            MINOR=$MINOR
            PATCH=$((PATCH + 1))
          else
            # Default to patch if no semver label is present
            echo "::warning::No semver label found on PR. Defaulting to patch bump."
            MAJOR=$MAJOR
            MINOR=$MINOR
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEW_VERSION"

      - name: Create and push tag
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${NEW_VERSION}" -m "v${NEW_VERSION}: ${PR_TITLE} (#${PR_NUMBER})"
          git push origin "v${NEW_VERSION}"
          echo "✅ Tagged v${NEW_VERSION}"
